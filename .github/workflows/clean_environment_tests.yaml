name: Clean Environment Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/clean_environment_tests.yaml"
      - "src/**"
      - "tests/**"
      - "**.props"
      - "**.targets"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/clean_environment_tests.yaml"
      - "src/**"
      - "tests/**"
      - "**.props"
      - "**.targets"
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  draft:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Fails because it's a draft PR
        run: exit 1

  # Previously this called Nexus-Mods/NexusMods.App.Meta's shared workflow, which installs
  # .NET 9 and also runs on macOS/Windows. This fork is Linux-only on .NET 10, so build and
  # test here instead, using the SDK from global.json.
  build-and-test:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: Build and Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Debug

      # TUnit projects use Microsoft.Testing.Platform, which the .NET 10 SDK no longer runs through
      # VSTest-style `dotnet test`. Run the xUnit projects via a copy of the solution without them,
      # then run the TUnit projects with their own runner.
      - name: Find TUnit projects
        id: tunit
        run: |
          projects=$(grep -rl --include='*.csproj' 'Include="TUnit"' tests | sort | tr '\n' ' ')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "TUnit projects: $projects"

      - name: Test (xUnit)
        run: |
          cp NexusMods.App.sln ci-xunit.sln
          dotnet sln ci-xunit.sln remove ${{ steps.tunit.outputs.projects }}
          dotnet test ci-xunit.sln --no-build -c Debug \
            --filter "RequiresNetworking!=True&FlakeyTest!=True" \
            --blame-hang-timeout 20m

      - name: Test (TUnit)
        run: |
          status=0
          for project in ${{ steps.tunit.outputs.projects }}; do
            name=$(basename "$project" .csproj)
            dll="$(dirname "$project")/bin/Debug/net10.0/$name.dll"
            echo "::group::$name"
            dotnet "$dll" --treenode-filter "/*/*/*/*[RequiresNetworking!=True]" || status=1
            echo "::endgroup::"
          done
          exit $status
