name: Clean Environment Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/clean_environment_tests.yaml"
      - "src/**"
      - "tests/**"
      - "**.props"
      - "**.targets"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/clean_environment_tests.yaml"
      - "src/**"
      - "tests/**"
      - "**.props"
      - "**.targets"
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  draft:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Fails because it's a draft PR
        run: exit 1

  # Previously this called Nexus-Mods/NexusMods.App.Meta's shared workflow, which installs
  # .NET 9 and also runs on macOS/Windows. This fork is Linux-only on .NET 10, so build and
  # test here instead, using the SDK from global.json.
  build-and-test:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: Build and Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Debug

      - name: Test
        run: >-
          dotnet test --no-build -c Debug
          --filter "RequiresNetworking!=True&FlakeyTest!=True"
          --blame-hang-timeout 20m
