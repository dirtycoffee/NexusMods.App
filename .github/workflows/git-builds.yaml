name: Linux AppImage Build

on:
  # Build the Linux AppImage whenever app code or the build setup changes, on any branch.
  push:
    paths:
      - "src/**"
      - "extern/**"
      - "**.props"
      - "**.targets"
      - "**.sln"
      - "**.csproj"
      - "global.json"
      - ".github/workflows/git-builds.yaml"
      - ".github/workflows/build-linux-pupnet.yaml"
  workflow_dispatch:

# A newer push to the same branch cancels the build that's still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ProjectFile: "src/NexusMods.App/NexusMods.App.csproj"

jobs:
  transformInputs:
    runs-on: ubuntu-latest
    outputs:
      ProjectFile: ${{ steps.setOutputs.outputs.projectFile }}

    steps:
      - name: Set Outputs
        id: setOutputs
        shell: pwsh
        run: |
          echo "projectFile=${{ env.ProjectFile }}" >> $env:GITHUB_OUTPUT

  build-linux:
    needs: [ transformInputs ]
    uses: ./.github/workflows/build-linux-pupnet.yaml
    with:
      # Continues from upstream's last release (0.21.x); the run number keeps builds ordered.
      AppVersion: "0.22.${{ github.run_number }}"
      # this is a bit of a hack, you can't use environment variables here
      # https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability
      ProjectFile: ${{ needs.transformInputs.outputs.ProjectFile }}
      RetentionDays: 7
      BuildAppImage: true
      BuildArchive: false
